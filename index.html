<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List nhạc dành tặng Bình🎶❤️‍🔥 </title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }
        .container {
            width: 400px;
            max-width: 90vw;
            height: 700px;
            max-height: 90vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }
        /* Header top icon */
        .top-icon {
            text-align: center;
            font-size: 45px;
            color: #ff4757;
            animation: rotate 1.5s infinite;
        }
        @keyframes rotate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: auto 0;
        }
        .menu-item {
            background: #fff;
            padding: 25px 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid #ffccd5;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            background: #fff0f3;
        }
        .menu-item span {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            color: #ff4757;
        }

        /* Modal Popups */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease-in-out;
            z-index: 10;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 22px;
            cursor: pointer;
            background: #ff4757;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* Music Card Style */
        .player-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-card img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #ff4757;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="top-icon">🎶🎶🎶🎶</div>

        <!-- 4 Menu Options -->
        <div class="menu-grid">
            <div class="menu-item" onclick="openModal('musicModal1')">
                <span style="font-size: 30px;">🎵👍</span>
                <span>Music 1</span>
            </div>
            <div class="menu-item" onclick="openModal('musicModal2')">
                <span style="font-size: 30px;">🎶✌️</span>
                <span>Music 2</span>
            </div>
            <div class="menu-item" onclick="openModal('musicModal3')">
                <span style="font-size: 30px;">🎶👌</span>
                <span>Music 3</span>
            </div>
            <div class="menu-item" onclick="openModal('musicModal4')">
                <span style="font-size: 30px;">🎶🤞</span>
                <span>Music 4</span>
            </div>
        </div>

        <!-- Modal 1: Nhạc 1 -->
        <div class="modal" id="musicModal1">
            <button class="close-btn" onclick="closeModal('musicModal1')">&times;</button>
            <div class="player-card">
                <img src="1792941331239_132097074588797862_9210615479021449889_6296e897092d7f9f6478f57c958d0190" alt="Avatar">
                <h3>Bài Hát Số 1</h3>
                <p style="color: #777; font-size: 14px; margin-top: 5px;">Đang phát...</p>
                <audio controls loop style="width: 100%; margin-top: 15px;">
                    <source src="butchibac.mp3" type="audio/mp3">
                </audio>
            </div>
        </div>

        <!-- Modal 2: Nhạc 2 -->
        <div class="modal" id="musicModal2">
            <button class="close-btn" onclick="closeModal('musicModal2')">&times;</button>
            <div class="player-card">
                <img src="1792941329822_132097074588797862_9210615479021449889_5cc0c8d7bde9f3eb0e7327faebc22726" alt="Avatar">
                <h3>Bài Hát Số 2</h3>
                <p style="color: #777; font-size: 14px; margin-top: 5px;">Đang phát...</p>
                <audio controls loop style="width: 100%; margin-top: 15px;">
                    <source src="emko.mp3" type="audio/mp3">
                </audio>
            </div>
        </div>

        <!-- Modal 3: Nhạc 3 -->
        <div class="modal" id="musicModal3">
            <button class="close-btn" onclick="closeModal('musicModal3')">&times;</button>
            <div class="player-card">
                <img src="anh2.jpg" alt="Avatar">
                <h3>Bài Hát Số 3</h3>
                <p style="color: #777; font-size: 14px; margin-top: 5px;">Đang phát...</p>
                <audio controls loop style="width: 100%; margin-top: 15px;">
                    <source src="baby.mp3" type="audio/mp3">
                </audio>
            </div>
        </div>

        <!-- Modal 4: Nhạc 4 -->
        <div class="modal" id="musicModal4">
            <button class="close-btn" onclick="closeModal('musicModal4')">&times;</button>
            <div class="player-card">
                <img src="1792941330820_132097074588797862_9210615479021449889_976aa9d5b409333b90ada19ec3354ce4" alt="Avatar">
                <h3>Bài Hát Số 4</h3>
                <p style="color: #777; font-size: 14px; margin-top: 5px;">Đang phát...</p>
                <audio controls loop style="width: 100%; margin-top: 15px;">
                    <source src="maiminhxa.mp3" type="audio/mp3">
                    Trình duyệt của bạn không hỗ trợ audio.
                </audio>
            </div>
        </div>

        <div style="text-align: center; font-size: 12px; color: #888;">Made with ❤️ for you</div>
    </div>

    <script>
        function openModal(modalId) {
            document.querySelectorAll('.modal').forEach(modal => modal.classList.remove('active'));
            const targetModal = document.getElementById(modalId);
            if (targetModal) {
                targetModal.classList.add('active');
                const audio = targetModal.querySelector('audio');
                if (audio) audio.play();
            }
        }
        function closeModal(modalId) {
            const targetModal = document.getElementById(modalId);
            if (targetModal) {
                targetModal.classList.remove('active');
                const audio = targetModal.querySelector('audio');
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            }
        }
    </script>
</body>
</html>
